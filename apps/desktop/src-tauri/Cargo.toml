[package]
name = "calendar-scheduling-desktop"
version = "1.0.0"
description = "Desktop shell for the Calendar & Scheduling application"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "calendar_scheduling_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
