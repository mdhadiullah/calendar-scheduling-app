# Local Supabase CLI configuration (development only).
# Run `supabase start` from the repo root after installing the Supabase CLI.
# Docs: https://supabase.com/docs/guides/cli/local-development

project_id = "calendar-scheduling-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173", "http://localhost:1420"]
jwt_expiry = 3600
enable_signup = false # accounts are created by an administrator, not self-registration

[auth.email]
enable_signup = false
enable_confirmations = false # local dev only; production uses hosted Supabase email confirmations

[realtime]
enabled = true

[storage]
enabled = true
file_size_limit = "10MiB"
